spring:
  application:
    name: riva-backend

  # Spring Boot 4 usa spring.mongodb.*. Estos defaults coinciden con docker-compose/.env.example
  # para que el backend tambien pueda correr localmente contra Mongo en Docker.
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://${MONGO_USER:riva}:${MONGO_PASSWORD:rivapass}@localhost:27017/${MONGO_DB:rivadb}?authSource=admin}
    database: ${SPRING_MONGODB_DATABASE:rivadb}

spring.data.mongodb.auto-index-creation: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:changeme_in_production}
