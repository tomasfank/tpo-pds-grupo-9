spring:
  application:
    name: riva-backend

  # MongoDB: en Spring Boot 4 el prefix cambió de "spring.data.mongodb.*" a "spring.mongodb.*"
  # (las keys viejas están deprecated y son ignoradas). En docker-compose se inyecta vía
  # SPRING_MONGODB_URI / SPRING_MONGODB_DATABASE (relaxed binding).
  # Para dev local sin Docker: exportar SPRING_MONGODB_URI antes de correr la app o sobreescribir aquí.

spring.data.mongodb.auto-index-creation: true

server:
  port: 8080

# Configuración propia de la app. Hasta que se implemente el módulo de auth (CU-01 / CU-02)
# el secret solo se carga, no se usa.
app:
  jwt:
    secret: ${JWT_SECRET:changeme_in_production}